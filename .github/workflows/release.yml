name: Build and Publish to itch.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  ITCH_USER: silentsword-123
  ITCH_GAME: oxigen

jobs:
  export:
    name: Export Godot builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export builds
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Prepare build artifacts
        run: |
          set -e
          ARCHIVES="/home/runner/.local/share/godot/archives"
          ls -la "$ARCHIVES"
          mkdir -p "${{ github.workspace }}/builds"
          cp "$ARCHIVES/Windows Desktop.zip" "${{ github.workspace }}/builds/windows.zip"
          cp "$ARCHIVES/Web.zip" "${{ github.workspace }}/builds/web.zip"

      - name: Verify web build layout
        run: |
          unzip -l builds/web.zip
          if ! unzip -l builds/web.zip | grep -qE '[[:space:]]index\.html$'; then
            echo "::error::index.html is not at the root of web.zip"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: ${{ github.workspace }}/builds/*.zip

  publish:
    name: Publish to itch.io
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: builds
          path: builds

      - name: List builds (debug)
        run: ls -R builds

      - name: Publish Windows build
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: ${{ env.ITCH_GAME }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: builds/windows.zip

      - name: Publish Web build
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: ${{ env.ITCH_GAME }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: builds/web.zip
